name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kotlin compiler
        run: |
          curl -sSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q kotlin.zip

      - name: Compile Main.kt
        run: ./kotlinc/bin/kotlinc Main.kt -include-runtime -d mizizi.jar

      - name: Smoke test (archive + daily proverb + exit)
        run: printf '2\n3\n4\n' | java -jar mizizi.jar | grep -E "MY ARCHIVE|PROVERB OF THE DAY"
