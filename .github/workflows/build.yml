name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Main.kt
        run: docker run --rm -v "$PWD":/app -w /app kotlin:2.1.20 kotlinc Main.kt -include-runtime -d mizizi.jar

      - name: Smoke test (archive + daily proverb + exit)
        run: printf '2\n3\n4\n' | docker run --rm -i -v "$PWD":/app -w /app kotlin:2.1.20 java -jar mizizi.jar | grep -E "MY ARCHIVE|PROVERB OF THE DAY"
